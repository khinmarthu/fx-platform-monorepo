server {
    listen 80;

    # No trailing slash after the service name — this forwards the request
    # path unchanged, matching each app's own /pricing//blotter base.
    location /pricing/ {
        proxy_pass http://pricing;
    }

    location /blotter/ {
        proxy_pass http://blotter;
    }

    # WebSocket upgrade — proxy_http_version 1.1 + these headers are required
    # for nginx to hand off an HTTP connection to a raw WS one.
    location /ws {
        proxy_pass http://mock-ws-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://shell;
    }
}
